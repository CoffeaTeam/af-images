name: base
channels:
  - conda-forge
dependencies:
  # python version specified in Dockerfile
  - setuptools<=71
  - gxx
  - voms # x509 proxy system
  - ca-policy-lcg # WLCG trusted CAs
  - xrootd
  - htcondor
  - curl
    # jupyter-related
  - jupyterlab
  - ipympl
  - dask_labextension
  - dask-gateway
  - dask-jobqueue
  - dask-expr
   # To be reverted: Dask needs to be pinned for now, do not use dask>=2024.12.0 with coffea, dask-awkward, or uproot
  - dask<2025.4.0
    # bokeh>=3.7 made Client()/scheduler shutdown call an async-only stop()
    # path that the distributed pulled in by the dask pin above doesn't use,
    # raising "Cannot synchronously wait on a running event loop" on close
    # (fixed upstream in dask/distributed#9026, not in our pinned range).
  - bokeh<3.7
  # Add workqueue
  - ndcctools
    # core scipy
    #- nomkl # no Intel math kernel library, reduces image size
  - numpy<2
  - scipy
  - pandas
    # compression
  - lz4
  - python-xxhash
  - zstandard
    # file formats
  - h5py
  - uproot<5
    # misc.
  - pytables
  - python-rapidjson
  - geventhttpclient
  - brotli
  - correctionlib
  - python-graphviz
    # scikit-hep
  - vector<1.5
  - hist
    # ML
  - xgboost
  - pytorch
  - pip
  - rucio-clients
  - pytorch_geometric
  - onnxruntime
  - pip:
    - awkward == 1.10.5
    - coffea == 0.7.31
    - fastjet == 3.4.0.1 # LAST VERSION working with awkward1
    - tritonclient[grpc,http]
