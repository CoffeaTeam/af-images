name: Docker build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "*"
  pull_request:

env:
  DOCKER_ORG: coffeateam
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  # Update each time there is added latest python: it will be used for `latest` tag
  python_latest: "3.13"
  python_latestv0: "3.11"
  # For coffea 2024.x.x we have conda release, github CI bot will detect new version and open PR with changes
  release: "2026.5.0"
  # For coffea 0.7.23 we dont have conda release, please update it manually, as well in coffea-base/environment.yaml
  releasev0: "0.7.31"
  # Deprecation shim: also push the pre-rename image names as aliases of the
  # new ones (same digest, no content change):
  #   coffea-base-x -> coffea-0.7-x
  #   coffea-dask-x -> coffea-dak-x
  # coffea-x is new and has no legacy name. Set to "false" to stop publishing
  # the old names once users have migrated, then delete the shim entirely.
  push_legacy_aliases: "true"

jobs:

  matrix-build:
    strategy:
      fail-fast: false
      matrix:
        image_dir: [coffea-base, coffea-dask]
        #registry: [docker.io, hub.opensciencegrid.org]
        registry: [docker.io]
        distro: [almalinux8, almalinux9, almalinux9-noml, almalinux9-eaf]
        python: ["3.11", "3.12", "3.13"]
        # Which calver flavour to build from the coffea-dask sources:
        #   "1" -> coffea-dak-x : with dask-awkward/dask-histogram.
        #                         dask/distributed pinned by dask-awkward.
        #   "0" -> coffea-x     : no dask-awkward. dask/distributed unpinned.
        with_dask_awkward: ["1", "0"]
        exclude:
          - image_dir: coffea-base
            distro: almalinux9-noml
          - image_dir: coffea-base
            distro: almalinux9-eaf
          - image_dir: coffea-base
            python: "3.12"
          - image_dir: coffea-base
            python: "3.13"
          - image_dir: coffea-dask
            python: "3.11"
          # coffea-base is coffea 0.7.x: no hist.dask code path, so the
          # dask-awkward axis does not apply to it at all.
          - image_dir: coffea-base
            with_dask_awkward: "0"
          # coffea-x is built for exactly one combination for now:
          # almalinux9-noml / py3.13.
          - distro: almalinux8
            with_dask_awkward: "0"
          - distro: almalinux9
            with_dask_awkward: "0"
          - distro: almalinux9-eaf
            with_dask_awkward: "0"
          - python: "3.12"
            with_dask_awkward: "0"
    name: ${{ matrix.image_dir }}-${{ matrix.distro }}-${{ matrix.python }}${{ matrix.with_dask_awkward == '0' && '-nodak' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-docker-action@v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Login to DockerHub
      uses: docker/login-action@v1
      if: github.event_name == 'push'
      with:
        username: ${{ secrets.DOCKERHUB_ACCOUNT }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      if: github.event_name == 'push'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Harbor Hub
      if: success() && github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: hub.opensciencegrid.org
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Workaround to free up 5GB of space # see https://github.com/actions/runner-images/issues/709#issuecomment-612569242
      run: sudo rm -rf "/usr/local/share/boost" && sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Generate Docker and OSG tags
      id: tags
      env:
        image_dir: ${{ matrix.image_dir }}
        python: ${{ matrix.python }}
        distro: ${{ matrix.distro }}
        releasev0: ${{ env.releasev0 }}
        release: ${{ env.release }}
        python_latest: ${{ env.python_latest }}
        python_latestv0: ${{ env.python_latestv0 }}
        stable: ${{ startsWith(github.ref, 'refs/tags') }}
        ref_branch: ${{ github.ref }}
        registry: ${{ matrix.registry }}
        with_dask_awkward: ${{ matrix.with_dask_awkward }}
        push_legacy_aliases: ${{ env.push_legacy_aliases }}
      run: |
        # ---- image naming ------------------------------------------------
        # Deliberately decoupled from ${image_dir} (the source directory), so
        # images can be renamed without moving directories. Edit here only.
        #
        #   coffea-0.7-x   coffea 0.7.31
        #   coffea-dak-x   calver + dask-awkward/dask-histogram ("dak" is the
        #                  usual import alias). dask/distributed pinned by dak.
        #   coffea-x       calver, no dask-awkward. dask/distributed unpinned.
        #
        # coffea-base-x and coffea-dask-x are retired as canonical names, but
        # are still published as aliases while push_legacy_aliases is true.
        # Neither is reused for a different flavour, so an existing pull of
        # coffea-dask-x keeps resolving to identical contents (== coffea-dak-x).
        if [ "${image_dir}" == 'coffea-base' ]; then
          flavour="coffea-0.7"
          legacy_flavour="coffea-base"
        elif [ "${with_dask_awkward}" == "1" ]; then
          flavour="coffea-dak"
          legacy_flavour="coffea-dask"
        else
          flavour="coffea"
          legacy_flavour=""        # new flavour: no pre-rename name to alias
        fi

        name="coffeateam/${flavour}-${distro}"
        image="${registry}/${name}"      # e.g. docker.io/coffeateam/coffea-dak-almalinux9
        osgimage="${name}"               # registry-less; Harbor prefix added at push time

        legacy_image=""
        legacy_osgimage=""
        if [ "${push_legacy_aliases}" == "true" ] && [ -n "${legacy_flavour}" ]; then
          legacy_name="coffeateam/${legacy_flavour}-${distro}"
          legacy_image="${registry}/${legacy_name}"
          legacy_osgimage="${legacy_name}"
        fi

        # ---- tag suffixes ------------------------------------------------
        # Decide the tag names once, then apply the same list to both the
        # docker.io image and the Harbor (OSG) image.
        if [ "${stable}" == "true" ]; then
          if [ "${image_dir}" == 'coffea-base' ]; then
            version_tag="${releasev0}-py${python}"
          else
            version_tag="${release}-py${python}"
          fi
          suffixes="${version_tag} latest-py${python}"
          if [ "${python}" == "${python_latest}" ] || [ "${python}" == "${python_latestv0}" ]; then
            suffixes="latest ${suffixes}"
          fi
        elif [ "${ref_branch}" == "refs/heads/main" ]; then
          version_tag="head-py${python}"
          suffixes="${version_tag}"
          if [ "${python}" == "${python_latest}" ] || [ "${python}" == "${python_latestv0}" ]; then
            suffixes="head ${suffixes}"
          fi
        else
          version_tag="dev-py${python}"
          suffixes="${version_tag}"
          if [ "${python}" == "${python_latest}" ] || [ "${python}" == "${python_latestv0}" ]; then
            suffixes="dev ${suffixes}"
          fi
        fi

        tag="${image}:${version_tag}"    # the single tag the test steps run against

        tags=""
        osgtags=""
        for s in ${suffixes}; do
          tags="${tags}${tags:+,}${image}:${s}"
          osgtags="${osgtags}${osgtags:+,}${osgimage}:${s}"
          if [ -n "${legacy_image}" ]; then
            tags="${tags},${legacy_image}:${s}"
            osgtags="${osgtags},${legacy_osgimage}:${s}"
          fi
        done

        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        echo "osgtags=${osgtags}" >> "$GITHUB_OUTPUT"

    - name: Build coffea-0.7
      if: ${{ matrix.image_dir == 'coffea-base' }}
      uses: docker/build-push-action@v6
      with:
        load: true
        tags: ${{ steps.tags.outputs.tags }},${{ steps.tags.outputs.osgtags }}
        context: ${{ matrix.image_dir }}
        file: ${{ matrix.image_dir }}/Dockerfile.${{ matrix.distro }}
        build-args: |
          python=${{ matrix.python }}
          releasev0=${{ env.releasev0 }}

    - name: Build calver (coffea-dak / coffea)
      if: ${{ matrix.image_dir != 'coffea-base' }}
      uses: docker/build-push-action@v6
      with:
        load: true
        tags: ${{ steps.tags.outputs.tags }},${{ steps.tags.outputs.osgtags }}
        context: ${{ matrix.image_dir }}
        file: ${{ matrix.image_dir }}/Dockerfile.${{ matrix.distro }}
        build-args: |
          python=${{ matrix.python }}
          release=${{ env.release }}
          WITH_DASK_AWKWARD=${{ matrix.with_dask_awkward }}

    - name: Test Conda environement
      env:
        tag: ${{ steps.tags.outputs.tag }}
      run: |
        docker run --rm ${tag} conda list --export

    # Runs before the tests so it still prints when they fail. Diffing this
    # between coffea-dak-* and coffea-* is the point of the second flavour:
    # if `distributed` resolves to the same version in both, the pin is not
    # coming from dask-awkward.
    - name: Show resolved dask stack
      if: ${{ matrix.image_dir != 'coffea-base' }}
      env:
        tag: ${{ steps.tags.outputs.tag }}
      run: |
        docker run --rm ${tag} \
          conda list --export | grep -E '^(dask|distributed|dask-awkward|dask-histogram)=' || true

    - name: Make sure voms tools are working
      env:
        tag: ${{ steps.tags.outputs.tag }}
      run: |
        ERROR=$(docker run ${tag} voms-proxy-info 2>&1 > /dev/null; exit 0)
        TEST=$(echo -e "\nCouldn't find a valid proxy.\n")

        if [ "$ERROR" == "$TEST" ]; then
          exit 0
        else
          exit 1
        fi

    - name: Test Pytest environement v0
      if: ${{ matrix.image_dir == 'coffea-base' }}
      env:
        tag: ${{ steps.tags.outputs.tag }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/tmp/workspace ${tag} \
        sh -c "pip install -U pytest && cd tmp/workspace && pytest -m v0 -rs"

    # -rs prints skip reasons, so the coffea-x job shows
    # "skipped: image built without dask-awkward" rather than looking like the
    # test silently disappeared.
    - name: Test Pytest environement CalVer
      if: ${{ matrix.image_dir != 'coffea-base' }}
      env:
        tag: ${{ steps.tags.outputs.tag }}
      run: |
        docker run --rm -v ${{ github.workspace }}:/tmp/workspace ${tag} \
        sh -c "pip install -U pytest && cd tmp/workspace && pytest -m calver -rs"

    - name: Build and push calver (coffea-dak / coffea)
      if: ${{ matrix.image_dir != 'coffea-base' }}
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.tags.outputs.tags }}
        context: ${{ matrix.image_dir }}
        file: ${{ matrix.image_dir }}/Dockerfile.${{ matrix.distro }}
        build-args: |
          python=${{ matrix.python }}
          release=${{ env.release }}
          WITH_DASK_AWKWARD=${{ matrix.with_dask_awkward }}

    - name: Build and push coffea-0.7
      if: ${{ matrix.image_dir == 'coffea-base' }}
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.tags.outputs.tags }}
        context: ${{ matrix.image_dir }}
        file: ${{ matrix.image_dir }}/Dockerfile.${{ matrix.distro }}
        build-args: |
          python=${{ matrix.python }}
          releasev0=${{ env.releasev0 }}

    # All flavours go to Harbor. Each has a distinct repo name, so their
    # latest/head/dev tags cannot shadow each other.
    - name: Push to Harbor Hub
      if: ${{ github.event_name == 'push' }}
      env:
        TAGS: ${{ steps.tags.outputs.osgtags }}
      run: |
        set -euo pipefail
        if [ -z "${TAGS}" ]; then
          echo "No OSG tags generated; nothing to push." >&2
          exit 1
        fi
        for tag in $(echo "${TAGS}" | tr ',' ' '); do
          harbor_tag="hub.opensciencegrid.org/${tag}"
          echo "Tagging ${tag} -> ${harbor_tag}"
          docker tag "${tag}" "${harbor_tag}"
          docker push "${harbor_tag}"
        done