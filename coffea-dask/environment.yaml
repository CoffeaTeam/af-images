name: base
channels:
  - conda-forge
dependencies:
  # python version specified in Dockerfile
  #- gxx
  - voms # x509 proxy system
  - ca-policy-lcg # WLCG trusted CAs
  - xrootd
  - htcondor
  - curl
    # jupyter-related
  - jupyterlab
  - ipympl
  - dask_labextension
  - dask-gateway
  - dask-jobqueue
  - dask<2025.4.0
  - dask-awkward
  - dask-histogram
    # bokeh>=3.7 made Client()/scheduler shutdown call an async-only stop()
    # path that the distributed pulled in by the dask pin above doesn't use,
    # raising "Cannot synchronously wait on a running event loop" on close
    # (fixed upstream in dask/distributed#9026, not in our pinned range).
  - bokeh<3.7
  # Add workqueue
  - ndcctools
    # core scipy
    #- nomkl # no Intel math kernel library, reduces image size
  - numpy>=2
  - scipy
  - pandas
    # compression
  - lz4
  - python-xxhash
  - zstandard
    # file formats
  - h5py
  - uproot>=5.6.2
    # misc.
  - pytables
  - python-rapidjson
  - geventhttpclient
  - brotli
  - correctionlib
  - python-graphviz
    # scikit-hep
  # FIXME: # disable microarches for awkward-cpp
  - awkward
  - vector
  - hist
    # ML
  - xgboost
  - pytorch
  - pytorch_geometric
  - pip
  - rucio-clients
  - fastjet
  - coffea=2026.7.0
  - onnxruntime
  - fsspec-xrootd
  - pip:
    - tritonclient[grpc,http]
    - coffea-workflow
